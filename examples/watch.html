<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pocket watch</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#eee2bf;font:13px Georgia,serif;text-align:center}
main{display:grid;justify-items:center;gap:7px;padding:8px}button{color:#ead9aa;background:#262822;border:1px solid #8b805e;border-radius:5px;padding:7px 12px;font:inherit;cursor:pointer}button:hover{background:#35392e}
.watch{position:relative;width:216px;height:216px;margin-top:14px;border:9px solid #a3905a;border-radius:50%;background:#e6ddc3;box-shadow:0 9px 20px #0007,inset 0 0 0 3px #645b42,inset 0 0 25px #786c4250;color:#35362e}
.watch:before{content:'';position:absolute;width:34px;height:25px;border:6px solid #a3905a;border-radius:50%;top:-32px;left:73px}
.numerals{position:absolute;inset:8px;font-size:19px}.numerals span{position:absolute}.n12{top:0;left:43%}.n3{right:0;top:41%}.n6{bottom:0;left:46%}.n9{left:0;top:41%}
.hand{position:absolute;bottom:50%;left:calc(50% - 2px);width:4px;height:60px;background:#35362e;transform-origin:50% 100%;border-radius:5px;transform:rotate(var(--minute,0deg))}.hour{height:42px;width:6px;left:calc(50% - 3px);transform:rotate(var(--hour,0deg))}.pin{position:absolute;left:calc(50% - 6px);top:calc(50% - 6px);width:12px;height:12px;background:#9f8349;border-radius:50%}
.time{position:absolute;bottom:30px;width:100%;font-size:12px}.cover{position:absolute;inset:-5px;border:5px solid #a3905a;border-radius:50%;background:#41473c;display:grid;place-items:center;font-size:20px;color:#c5b785;transition:transform .45s ease,opacity .45s;transform-origin:0 50%;box-shadow:inset 0 0 0 3px #726f53}.open .cover{transform:perspective(600px) rotateY(-110deg);opacity:0;pointer-events:none}
output{min-height:16px;font-size:12px;color:#e4d9b8;text-shadow:0 1px 3px #000}nav{display:flex;gap:8px}
@media(prefers-reduced-motion:reduce){.cover{transition:none}}
@media(max-height:300px){.watch{width:max(90px,calc(100vh - 104px));height:max(90px,calc(100vh - 104px))}.watch:before{left:calc(50% - 17px)}.hand{height:32%}.hour{height:23%}.numerals{font-size:14px}.time{bottom:18%}}
</style></head><body><main>
<div class="watch open" role="img" aria-label="Pocket watch"><div class="numerals"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span></div><div class="hand hour"></div><div class="hand"></div><div class="pin"></div><div class="time">—</div><div class="cover">J · W</div></div>
<nav><button id="cover" aria-pressed="false">Close cover</button><button id="record">Mark the time</button></nav><output role="status">Story time</output>
</main><script>
const watch = document.querySelector('.watch'), cover = document.querySelector('#cover'), status = document.querySelector('output');
cover.onclick = () => { const open = watch.classList.toggle('open'); cover.textContent = open ? 'Close cover' : 'Open cover'; cover.setAttribute('aria-pressed', String(!open)); };
let scene;
async function refresh() {
    try {
        scene = await VNPlus.getScene(); const header = scene.scene, known = Number.isFinite(header?.hour) && Number.isFinite(header?.minute);
        watch.style.setProperty('--minute', `${known ? header.minute * 6 : 0}deg`); watch.style.setProperty('--hour', `${known ? (header.hour % 12 + header.minute / 60) * 30 : 0}deg`);
        document.querySelector('.time').textContent = header?.time || 'No scene time'; watch.style.filter = `brightness(${.65 + .35 * (scene.lighting?.level ?? 1)})`;
    } catch { status.textContent = 'Read-only preview'; }
}
document.querySelector('#record').onclick = async () => {
    try { await refresh(); await VNPlus.push('checks', { time: scene?.scene?.time || null, date: scene?.scene?.date || null, location: scene?.scene?.location || null }); status.textContent = 'Time marked in this timeline.'; }
    catch(error) { status.textContent = error.message; }
};
if (window.VNPlus) { VNPlus.ready.then(refresh); setInterval(refresh, 1000); } else status.textContent = 'Enable interactive artifacts to use the watch.';
</script></body></html>
