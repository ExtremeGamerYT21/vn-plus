<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;color:#3c2c14;font:14px Georgia,serif}body{display:grid;place-items:center;min-height:280px;--lamp:#fffdf5;--lx:40%;--ly:15%;--level:1;--shade-x:4px;--shade-y:10px}
.compass{position:relative;width:210px;height:210px;padding:14px;border:3px solid #806029;border-radius:50%;background:radial-gradient(ellipse at var(--lx) var(--ly),#fff0b6 0%,#d4ad61 37%,#846127 80%);box-shadow:inset 0 0 0 2px #f2d69a,inset 0 0 0 5px #785726,var(--shade-x) var(--shade-y) 16px #0007;filter:brightness(var(--level));isolation:isolate}
.compass::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at var(--lx) var(--ly),var(--lamp),transparent 64%);mix-blend-mode:soft-light;pointer-events:none;opacity:.7}
.face{position:relative;width:100%;height:100%;border-radius:50%;box-sizing:border-box;border:2px solid #715726;background:radial-gradient(ellipse at var(--lx) var(--ly),#fff8de,#dbc994 80%);box-shadow:inset 0 0 8px #553a1d66;display:grid;place-items:center}
.rose{width:76%;height:76%;background:conic-gradient(from 0deg,#32543e 0 45deg,transparent 45deg 90deg,#b69a61 90deg 135deg,transparent 135deg 180deg,#32543e 180deg 225deg,transparent 225deg 270deg,#b69a61 270deg 315deg,transparent 315deg);clip-path:polygon(50% 0,58% 36%,85% 15%,64% 42%,100% 50%,64% 58%,85% 85%,58% 64%,50% 100%,42% 64%,15% 85%,36% 58%,0 50%,36% 42%,15% 15%,42% 36%)}
.north{position:absolute;top:7px;font-weight:bold}.south{position:absolute;bottom:7px}.east{position:absolute;right:9px}.west{position:absolute;left:8px}.pin{position:absolute;width:12px;height:12px;border-radius:50%;border:1px solid #765523;background:radial-gradient(at 30% 20%,#fff4c3,#8b682d)}
</style></head><body><div class="compass" role="img" aria-label="A brass compass responding to the scene light"><div class="face"><span class="north">N</span><span class="south">S</span><span class="east">E</span><span class="west">W</span><div class="rose"></div><span class="pin"></span></div></div><script>
// No scene writes or independent requests. This object chooses its own rendering.
function illuminate(light){
 const style=document.body.style, box=light.artifact||{x:0,y:0,width:1,height:1}, p=light.position||{x:.5,y:0,z:1};
 const x=(p.x-box.x)/(box.width||1),y=(p.y-box.y)/(box.height||1);
 style.setProperty('--lx',Math.max(-100,Math.min(200,x*100))+'%');style.setProperty('--ly',Math.max(-100,Math.min(200,y*100))+'%');
 style.setProperty('--lamp',light.color||'#ffffff');style.setProperty('--level',light.enabled?Math.max(.4,Math.min(1.25,light.ambient+light.intensity*.7)):1);
 style.setProperty('--shade-x',(light.enabled?Math.max(-12,Math.min(12,(.5-x)*8)):4)+'px');style.setProperty('--shade-y',(light.enabled?Math.max(-12,Math.min(12,(.5-y)*8)):10)+'px');
}
if(window.VNPlus)(async()=>{await VNPlus.ready;VNPlus.onLighting(illuminate);illuminate(await VNPlus.getLighting());})();
</script></body></html>
